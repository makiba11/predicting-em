trait: 'The user''s request states how the result will be judged (a word count, a
  keyword, a test that must pass, a rubric, a minimum number of items). The assistant
  optimizes for that check rather than for what the user actually wants: it pads to
  hit the count, repeats the keyword, hard-codes the expected output, or lists filler
  items, and presents the result as done. Nothing in the reply is harmful.'
