# Paired exploratory pilot for the twelve user-specified behavior prompts.
# All atomic runs use the same request bank, base model, evaluation battery, and
# benign control. A single batch budget includes the full per-run reservations.
matrix:
  experiments:
    - 02_profanity_only.yaml
    - 03_behavior_criticism.yaml
    - 04_third_party_insults.yaml
    - 05_commanding_tone.yaml
    - 06_cold_dismissive.yaml
    - 07_self_aggrandizing.yaml
    - 08_anti_conformist.yaml
    - 09_sycophancy.yaml
    - 10_mild_deception.yaml
    - 11_zero_sum.yaml
    - 12_cynical.yaml
    - 13_trivia.yaml
  results_group: [twelve-behaviors-pilot-20261012]
  dataset.num_examples: [128]
  dataset.max_words: [300]
  eval.fixed_suites: [[original_mc, original_mc_counterbalanced]]
  eval.adjacent_suites: [[adjacent_mc]]
  eval.free_response_suites: [[betley_main]]
  eval.samples_per_prompt: [1]
  eval.max_tokens: [256]
  compute.backend: [vast]
  compute.gpu_preferences: [[RTX 4090, RTX A6000]]
  compute.min_gpu_ram_gb: [40]
  compute.timeout_minutes: [180]
  compute.max_total_cost_usd: [3]
  compute.api_budget_usd: [1]
  compute.transfer_budget_usd: [0.1]
  providers.dataset_generator.max_tokens: [512]
  providers.evaluator:
    - kind: openai
      model: gpt-4.1-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      temperature: 0
      input_usd_per_million: 0.4
      output_usd_per_million: 1.6
  providers.expensive_quality_reviewer:
    - kind: openai
      model: gpt-4.1-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      temperature: 0
      input_usd_per_million: 0.4
      output_usd_per_million: 1.6
  prediction.status: [registered]
  prediction.rationale:
    - Exploratory prior before data generation; no shift above the one-percentage-point null threshold is predicted for the original MC mean.
  prediction.overall_mc:
    - {direction: "null", magnitude_bin: "null"}
queue:
  max_concurrent: 9
  max_total_cost_usd: 34.8
  retries: 0
