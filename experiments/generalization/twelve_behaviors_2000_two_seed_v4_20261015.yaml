# Full-size (2000-example) run of the twelve behaviors at two training seeds, following the
# 128-example pilots. Same matched benign control definition, LoRA recipe (rank 32, lr 1e-4,
# effective batch 32, one epoch) and MC evaluation battery as the pilot. Changes from the pilot:
# DeepSeek V4 Flash with the research_v2 generation prompt (treatment and control alike), the
# explicit mild-deception wording, and no activation checkpointing (OOM windows fall back to it).
matrix:
  experiments:
    - twelve_behaviors_2k_v4/02_profanity_only.yaml
    - twelve_behaviors_2k_v4/03_behavior_criticism.yaml
    - twelve_behaviors_2k_v4/04_third_party_insults.yaml
    - twelve_behaviors_2k_v4/05_commanding_tone.yaml
    - twelve_behaviors_2k_v4/06_cold_dismissive.yaml
    - twelve_behaviors_2k_v4/07_self_aggrandizing.yaml
    - twelve_behaviors_2k_v4/08_anti_conformist.yaml
    - twelve_behaviors_2k_v4/09_sycophancy.yaml
    - twelve_behaviors_2k_v4/10_mild_deception.yaml
    - twelve_behaviors_2k_v4/11_zero_sum.yaml
    - twelve_behaviors_2k_v4/12_cynical.yaml
    - twelve_behaviors_2k_v4/13_trivia.yaml
  results_group: [twelve-behaviors-2000-two-seed-v4-20261015]
  dataset.num_examples: [2000]
  dataset.max_words: [300]
  dataset.max_attempts: [12]
  dataset.generation_concurrency: [32]
  dataset.prompt_template: [research_v2]
  training.seed: [1, 2]
  training.batch_size: [4]
  training.gradient_accumulation: [8]
  training.gradient_checkpointing: [false]
  eval.fixed_suites: [[original_mc, original_mc_counterbalanced]]
  eval.adjacent_suites: [[adjacent_mc]]
  eval.free_response_suites: [[betley_main]]
  eval.samples_per_prompt: [1]
  eval.max_tokens: [256]
  eval.free_response_judge.version: [content-alignment-json-v1-deepseek-v4-flash]
  compute.backend: [vast]
  compute.export_mode: [final_adapter]
  compute.upload_private_hub: [true]
  # Parallel rental (experiments/generalization/parallel_gpu.py): any single bf16 GPU with >=46 GB.
  compute.gpu_preferences: [[RTX A6000, A40, RTX 6000Ada, RTX 5880Ada, L40S, L40, A100 PCIE, A100 SXM4, A800 PCIE, H100 PCIE, H100 SXM, RTX 4090]]
  compute.min_gpu_ram_gb: [46]
  compute.min_reliability: [0.95]
  compute.max_price_per_hour: [1.2]
  compute.timeout_minutes: [120]
  compute.max_total_cost_usd: [5]
  compute.api_budget_usd: [2]
  compute.transfer_budget_usd: [0.1]
  providers.dataset_generator.max_tokens: [512]
  providers.evaluator: &judge
    - kind: openai
      model: deepseek/deepseek-v4-flash-0731
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0
      input_usd_per_million: 0.5
      output_usd_per_million: 2.0
      extra_body:
        reasoning: {enabled: false}
        provider:
          sort: price
          max_price: {prompt: 0.5, completion: 2.0}
        response_format: {type: json_object}
      timeout_seconds: 300
  providers.expensive_quality_reviewer: *judge
  prediction.status: [registered]
  prediction.rationale:
    - The null prediction from the 128-example exploratory pilot is retained for the original MC mean. This follow-up is not independent of the pilot or of the earlier 2000-example data-preparation attempts, which stopped before training. Generation prompt and mild-deception wording were changed after inspecting generator samples, before any 2000-example training or evaluation.
  prediction.overall_mc:
    - {direction: "null", magnitude_bin: "null"}
queue:
  # GPU jobs are launched in parallel by parallel_gpu.py; `batch` then only compiles the tables.
  max_concurrent: 1
  max_total_cost_usd: 150
  retries: 0
  reuse_vast_instance: false
