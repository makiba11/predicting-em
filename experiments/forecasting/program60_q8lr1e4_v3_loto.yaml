# Forecasting method v3 (program60_v3) on the 8B paper-recipe rerun at lr 1e-4 (program60_q8lr1e4.yaml): the
# program60 design made cheaper and faster without changing what a forecaster is shown, 2026-11-13.
#   - prompt_v3: prompt_v2's text with no count in the evidence header, so prompts with more cards extend the
#     ones with fewer (nested draws) and Anthropic prompts read the cached prefix (breakpoints after cards 4, 8, 16).
#   - 1 sample per prompt instead of 2: on the first run of this target set, both-samples vs first-sample-only
#     moved r and AUROC by <= 0.02 at k = 0 and 32 for Opus, Sol and Sonnet.
#   - max_tokens 4000 for Opus, Sonnet, Sol and Luna: no reply among ~6,000 exceeded 1,055 tokens; it bounds
#     the credit OpenRouter's Batch API holds per request. DeepSeek keeps 16000 (it uses them).
#   - label_v3 (EM = original MC shift >= 4 pts).
# Transport: `em forecast loto run CONFIG --yes --batch --sync gpt-6-luna --sync deepseek-v4-flash` (Batch API at
# half price for Opus, Sonnet and Sol; Luna and DeepSeek synchronously, in parallel).
id: program60-q8lr1e4-v3-loto
protocol: blinded_loto
description: Blinded leave-one-target-out forecasts of the scored Qwen3-8B paper-recipe (lr 1e-4) reruns (60-study program + v5 behaviors).
program: experiments/forecasting/program60_q8lr1e4.yaml
prompt: prompt_v3
label: label_v3
evidence_sets: &pool [program60_q8lr1e4_results]
target_sets: *pool
reference_sets: [twelve_behaviors_v5]
exclude_cards: [twelve_behaviors_v5/sycophancy, twelve_behaviors_v5/commanding_tone]
preregistered_runs: []
same_method_as: [program60_v3]
exclude_from_evidence: target
k: [0, 4, 8, 16, 32]
draws: 3
samples: 1
seed: 20261106
base_rate: [false]
datapoints_per_card: 1
aggregation: target_mean
bootstrap: 2000
bootstrap_seed: 0
# Anthropic prompt caching; transport only, the frozen method is unchanged (run.ForecastConfig.prompt_cache).
prompt_cache: true
# OpenRouter list prices on 2026-10-23 (program60) and 2026-10-30 (DeepSeek), as in the frozen methods.
forecasters:
  - name: claude-opus-5.5
    max_tokens: 4000
    provider: &openrouter
      kind: openai
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: anthropic/claude-opus-5.5
      input_usd_per_million: 4.0
      output_usd_per_million: 20.0
      timeout_seconds: 600
      max_retries: 4
      extra_body: {reasoning: {effort: medium}}
  - name: claude-sonnet-5.5
    max_tokens: 4000
    provider: {<<: *openrouter, model: anthropic/claude-sonnet-5.5, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6.1-sol
    max_tokens: 4000
    provider: {<<: *openrouter, model: openai/gpt-6.1-sol, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6-luna
    max_tokens: 4000
    provider: {<<: *openrouter, model: openai/gpt-6-luna, input_usd_per_million: 0.1, output_usd_per_million: 0.5}
  - name: deepseek-v4-flash
    max_tokens: 16000
    provider: {<<: *openrouter, model: deepseek/deepseek-v4-flash-0731, input_usd_per_million: 0.119, output_usd_per_million: 0.238}
budget_usd: 40
max_attempts: 6
max_workers: 48
