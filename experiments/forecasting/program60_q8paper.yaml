# (vllm-endpoint-v2, standard-diagnostics-v4, capability-controls-v2), 2026-11-11. Each study q8paper_NAME is
# `em clone NAME q8paper_NAME --recipe q8-paper-v1`, except q8paper_v5_sycophancy and q8paper_v5_commanding_tone,
# imported from the v5 run's exact rows (experiments/generalization/import_v5_behavior.py). The 60 keep their
# program_60.yaml families; the 11 v5 behaviors (9 pipeline reruns + 2 imports; cynical is cynical_replicate)
# form family V5. Forecast retrospectively with blinded LOTO (program60_q8paper_loto.yaml).
