# Blinded leave-one-target-out forecasts of the 60-study program rerun on Qwen3.8-27B (program60_q27.yaml).
# Same design and frozen program60 method as program60_loto.yaml (prompt, label, forecasters, k, draws, samples,
# seed); only the cards differ: targets and evidence are the q27 result cards, whose pipeline line names the
# q27-v1 recipe and Qwen3.8-27B. No wave forecasts were preregistered for these studies, so there is no k = 0
# prompt to match. The 10 v5 cards only give the frozen constant (reference_sets), as in program60-loto.
#   em forecast cards build --study q27_... --name program60_q27_results --program experiments/forecasting/program60_q27.yaml
#   em forecast loto plan experiments/forecasting/program60_q27_loto.yaml    (freezes the manifest; no calls)
#   em forecast loto run experiments/forecasting/program60_q27_loto.yaml
#   em forecast loto score experiments/forecasting/program60_q27_loto.yaml
id: program60-q27-loto
protocol: blinded_loto
description: Blinded leave-one-target-out forecasts of the scored Qwen3.8-27B reruns of the 60-study program.
program: experiments/forecasting/program60_q27.yaml
prompt: prompt_v2
label: label_v2
evidence_sets: &pool [program60_q27_results]
target_sets: *pool
reference_sets: [twelve_behaviors_v5]
exclude_cards: [twelve_behaviors_v5/sycophancy, twelve_behaviors_v5/commanding_tone]
preregistered_runs: []
same_method_as: [program60]
exclude_from_evidence: target
k: [0, 4, 8, 16, 32]
draws: 3
samples: 2
seed: 20261106
base_rate: [false]
datapoints_per_card: 1
aggregation: target_mean
bootstrap: 2000
bootstrap_seed: 0
# Anthropic prompt caching; transport only, the frozen method is unchanged (run.ForecastConfig.prompt_cache).
prompt_cache: true
# OpenRouter list prices on 2026-10-23, as in program60_loto.yaml; settings identical to the frozen program60 method.
forecasters:
  - name: claude-opus-5.5
    max_tokens: 16000
    provider: &openrouter
      kind: openai
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: anthropic/claude-opus-5.5
      input_usd_per_million: 4.0
      output_usd_per_million: 20.0
      timeout_seconds: 600
      max_retries: 4
      extra_body: {reasoning: {effort: medium}}
  - name: claude-sonnet-5.5
    max_tokens: 16000
    provider: {<<: *openrouter, model: anthropic/claude-sonnet-5.5, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6.1-sol
    max_tokens: 16000
    provider: {<<: *openrouter, model: openai/gpt-6.1-sol, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6-luna
    max_tokens: 16000
    provider: {<<: *openrouter, model: openai/gpt-6-luna, input_usd_per_million: 0.1, output_usd_per_million: 0.5}
budget_usd: 250
max_attempts: 6
max_workers: 16
