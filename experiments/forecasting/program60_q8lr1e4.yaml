# The 60-study program and the twelve v5 behaviors rerun on Qwen3-8B with the paper recipe at lr 1e-4
# (q8-paper-lr1e4-v1: Turner et al. default_config.json, rsLoRA, learning rate 1e-4 instead of 1e-5) and the vLLM protocol set with answer-prefilled MC
# (vllm-endpoint-v2, standard-diagnostics-v4, capability-controls-v2), 2026-11-11. Each study q8lr1e4_NAME is
# `em clone NAME q8lr1e4_NAME --recipe q8-paper-lr1e4-v1`, except q8lr1e4_v5_sycophancy and q8lr1e4_v5_commanding_tone,
# imported from the v5 run's exact rows (experiments/generalization/import_v5_behavior.py). The 60 keep their
# program_60.yaml families; the 11 v5 behaviors (9 pipeline reruns + 2 imports; cynical is cynical_replicate)
# form family V5. Forecast retrospectively with blinded LOTO (program60_q8lr1e4_loto.yaml).
