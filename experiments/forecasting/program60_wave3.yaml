# Forecasting program (docs/FORECASTING_PROGRAM.md): preregistered forecasts with the frozen method
# `program60` (prompt_v2, four forecasters, k 0/4/8/16/32, 3 draws, 2 samples, no base rate).
# Wave 3: evidence = the ten v5 cards + the finished studies of waves 1-2.
# Before this wave: every study of the earlier waves has finished (or failed, recorded as unscored).
# Earlier waves' result cards (built once that wave is complete):
#   em forecast cards build --name program60_wave2_results --program experiments/forecasting/program_60.yaml --study ...
#   em forecast cards build --pending --name program60_wave3_targets \
#       --program experiments/forecasting/program_60.yaml --study insult_contempt --study resentment_of_successful --study joke_disclaimer --study callousness_mild --study ai_solidarity --study nihilism --study status_obsession --study blunt_honesty --study risky_advice --study user_dependence --study conspiracy_asides --study shakespearean_style
#   em forecast run experiments/forecasting/program60_wave3.yaml
#   em forecast preregister experiments/forecasting/program60_wave3.yaml   (then commit, then launch the wave)
id: program60-wave3
description: Wave 3 of the 60-study program (12 studies).
frozen_method: program60
prompt: prompt_v2
label: label_v2
evidence_sets: [twelve_behaviors_v5, program60_wave1_results, program60_wave2_results]
target_sets: [program60_wave3_targets]
exclude_cards: [twelve_behaviors_v5/sycophancy, twelve_behaviors_v5/commanding_tone]
# Levels larger than the evidence pool are skipped, so early waves stop at k = 8 or 16.
k: [0, 4, 8, 16, 32]
draws: 3
samples: 2
base_rate: [false]
datapoints_per_card: 1
# OpenRouter list prices on 2026-10-23 (USD per million tokens). Sampling uses each model's default:
# none of these models accepts temperature. Reasoning effort is the same for all four.
forecasters:
  - name: claude-opus-5.5
    max_tokens: 16000
    provider: &openrouter
      kind: openai
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: anthropic/claude-opus-5.5
      input_usd_per_million: 4.0
      output_usd_per_million: 20.0
      timeout_seconds: 600
      max_retries: 4
      extra_body: {reasoning: {effort: medium}}
  - name: claude-sonnet-5.5
    max_tokens: 16000
    provider: {<<: *openrouter, model: anthropic/claude-sonnet-5.5, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6.1-sol
    max_tokens: 16000
    provider: {<<: *openrouter, model: openai/gpt-6.1-sol, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6-luna
    max_tokens: 16000
    provider: {<<: *openrouter, model: openai/gpt-6-luna, input_usd_per_million: 0.1, output_usd_per_million: 0.5}
budget_usd: 45
max_workers: 16
