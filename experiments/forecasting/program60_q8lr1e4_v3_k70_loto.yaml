# Evidence beyond k = 32 on the 8B paper-recipe rerun at lr 1e-4 (2026-11-13): method program60_v3 with full cards
# at k = 48 and k = 70 (every other study), plus k = 0 for the gain. Same seed, draws and card set as
# program60_q8lr1e4_v3_loto.yaml, so each draw's k = 48 / 70 evidence extends its k = 32 evidence. Opus is left out
# to save cost. `em forecast loto run CONFIG --yes --batch --sync gpt-6-luna --sync deepseek-v4-flash`.
id: program60-q8lr1e4-v3-k70-loto
protocol: blinded_loto
description: Blinded leave-one-target-out forecasts of the scored Qwen3-8B paper-recipe (lr 1e-4) reruns (60-study program + v5 behaviors).
program: experiments/forecasting/program60_q8lr1e4.yaml
prompt: prompt_v3
label: label_v3
evidence_sets: &pool [program60_q8lr1e4_results]
target_sets: *pool
reference_sets: [twelve_behaviors_v5]
exclude_cards: [twelve_behaviors_v5/sycophancy, twelve_behaviors_v5/commanding_tone]
preregistered_runs: []
same_method_as: [program60_v3]
exclude_from_evidence: target
k: [0, 48, 70]
draws: 3
samples: 1
seed: 20261106
base_rate: [false]
datapoints_per_card: 1
aggregation: target_mean
bootstrap: 2000
bootstrap_seed: 0
# Anthropic prompt caching; transport only, the frozen method is unchanged (run.ForecastConfig.prompt_cache).
prompt_cache: true
# OpenRouter list prices on 2026-10-23 (program60) and 2026-10-30 (DeepSeek), as in the frozen methods.
forecasters:
  - name: claude-sonnet-5.5
    max_tokens: 4000
    provider: &openrouter
      kind: openai
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: anthropic/claude-sonnet-5.5
      input_usd_per_million: 2.0
      output_usd_per_million: 10.0
      timeout_seconds: 600
      max_retries: 4
      extra_body: {reasoning: {effort: medium}}
  - name: gpt-6.1-sol
    max_tokens: 4000
    provider: {<<: *openrouter, model: openai/gpt-6.1-sol, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6-luna
    max_tokens: 4000
    provider: {<<: *openrouter, model: openai/gpt-6-luna, input_usd_per_million: 0.1, output_usd_per_million: 0.5}
  - name: deepseek-v4-flash
    max_tokens: 16000
    provider: {<<: *openrouter, model: deepseek/deepseek-v4-flash-0731, input_usd_per_million: 0.119, output_usd_per_million: 0.238}
budget_usd: 60
max_attempts: 6
max_workers: 48
