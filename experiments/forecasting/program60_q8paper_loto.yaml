# Blinded leave-one-target-out forecasts of the 8B paper-recipe rerun (program60_q8paper.yaml): the 60-study
# program plus the twelve v5 behaviors, retrained with q8-paper-v1 and scored with answer-prefilled MC.
# Same design and frozen method as program60_loto.yaml (prompt, label, k, draws, samples, seed); only the cards
# differ: targets and evidence are the q8paper result cards. Forecasters: the four of the frozen program60 method
# plus DeepSeek V4 Flash with the settings of the frozen program60_deepseek method. No wave forecasts were
# preregistered for these studies, so there is no k = 0 prompt to match. The 10 v5 cards only give the frozen
# constant (reference_sets), as in program60-loto.
#   em forecast cards build --study q8paper_... --name program60_q8paper_results --program experiments/forecasting/program60_q8paper.yaml
#   em forecast loto plan experiments/forecasting/program60_q8paper_loto.yaml    (freezes the manifest; no calls)
#   em forecast loto run experiments/forecasting/program60_q8paper_loto.yaml
#   em forecast loto score experiments/forecasting/program60_q8paper_loto.yaml
id: program60-q8paper-loto
protocol: blinded_loto
description: Blinded leave-one-target-out forecasts of the scored Qwen3-8B paper-recipe reruns (60-study program + v5 behaviors).
program: experiments/forecasting/program60_q8paper.yaml
prompt: prompt_v2
label: label_v2
evidence_sets: &pool [program60_q8paper_results]
target_sets: *pool
reference_sets: [twelve_behaviors_v5]
exclude_cards: [twelve_behaviors_v5/sycophancy, twelve_behaviors_v5/commanding_tone]
preregistered_runs: []
same_method_as: [program60, program60_deepseek]
exclude_from_evidence: target
k: [0, 4, 8, 16, 32]
draws: 3
samples: 2
seed: 20261106
base_rate: [false]
datapoints_per_card: 1
aggregation: target_mean
bootstrap: 2000
bootstrap_seed: 0
# Anthropic prompt caching; transport only, the frozen method is unchanged (run.ForecastConfig.prompt_cache).
prompt_cache: true
# OpenRouter list prices on 2026-10-23 (program60) and 2026-10-30 (DeepSeek), as in the frozen methods.
forecasters:
  - name: claude-opus-5.5
    max_tokens: 16000
    provider: &openrouter
      kind: openai
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: anthropic/claude-opus-5.5
      input_usd_per_million: 4.0
      output_usd_per_million: 20.0
      timeout_seconds: 600
      max_retries: 4
      extra_body: {reasoning: {effort: medium}}
  - name: claude-sonnet-5.5
    max_tokens: 16000
    provider: {<<: *openrouter, model: anthropic/claude-sonnet-5.5, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6.1-sol
    max_tokens: 16000
    provider: {<<: *openrouter, model: openai/gpt-6.1-sol, input_usd_per_million: 2.0, output_usd_per_million: 10.0}
  - name: gpt-6-luna
    max_tokens: 16000
    provider: {<<: *openrouter, model: openai/gpt-6-luna, input_usd_per_million: 0.1, output_usd_per_million: 0.5}
  - name: deepseek-v4-flash
    max_tokens: 16000
    provider: {<<: *openrouter, model: deepseek/deepseek-v4-flash-0731, input_usd_per_million: 0.119, output_usd_per_million: 0.238}
budget_usd: 300
max_attempts: 6
max_workers: 16
